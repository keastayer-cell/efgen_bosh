spring:
  application:
    name: efgen-bosh-app

  config:
    import: optional:file:${EFGEN_BOSH_ENV_FILE:.env}[.properties]

  profiles:
    active: ${APP_PROFILE:local}

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DB_SCHEMA:public}
    schemas: ${DB_SCHEMA:public}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${APP_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
