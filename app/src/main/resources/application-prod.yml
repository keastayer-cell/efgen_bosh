spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:efgen_bosh}?currentSchema=${DB_SCHEMA:public}
    username: ${DB_USER:efgen_bosh}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:public}

logging:
  level:
    org.springframework.web: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
