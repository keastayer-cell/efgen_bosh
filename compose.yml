services:
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BOSH_DB_NAME:-efgen_bosh}
      POSTGRES_USER: ${BOSH_DB_USER:-efgen_bosh}
      POSTGRES_PASSWORD: ${BOSH_DB_PASSWORD:?Set BOSH_DB_PASSWORD in .env}
    ports:
      - "${BOSH_DB_PORT:-5434}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${BOSH_DB_USER:-efgen_bosh} -d ${BOSH_DB_NAME:-efgen_bosh}
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - bosh-postgres-data:/var/lib/postgresql/data

volumes:
  bosh-postgres-data:
