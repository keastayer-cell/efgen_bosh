name: CI

on:
  pull_request:
    branches:
      - dev
      - test
      - main
      - prod
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate migration files
        run: bash scripts/validate-migrations.sh
      - name: Backend tests and package
        run: mvn --batch-mode --no-transfer-progress -f app/pom.xml clean verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Production build
        working-directory: web
        run: npm run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: efgen_bosh_ci
          POSTGRES_USER: efgen_bosh
          POSTGRES_PASSWORD: efgen_bosh_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U efgen_bosh -d efgen_bosh_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package backend
        run: mvn --batch-mode --no-transfer-progress -f app/pom.xml -DskipTests package
      - name: Apply migrations and start backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: efgen_bosh_ci
          DB_SCHEMA: work
          DB_USER: efgen_bosh
          DB_PASSWORD: efgen_bosh_ci_password
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
          JWT_EXPIRES_MINUTES: 30
          JWT_REFRESH_EXPIRES_DAYS: 30
        run: bash scripts/verify-migrations-postgres.sh

  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate shell syntax
        run: bash -n scripts/*.sh
