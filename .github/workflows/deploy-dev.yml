name: Deploy Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
    env:
      VITE_API_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate deployment configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_HOST_FINGERPRINT VITE_API_BASE_URL; do
            [[ -n "${!name:-}" ]] || { echo "Missing GitHub Environment value: $name" >&2; exit 1; }
          done
      - name: Test and package backend
        run: mvn --batch-mode --no-transfer-progress clean verify -f app/pom.xml
      - name: Test and build frontend
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Pack release
        run: |
          mkdir -p release
          cp app/target/efgen-bosh-app-0.0.1-SNAPSHOT.jar release/app.jar
          tar -C web/dist -czf release/web-dist.tgz .
          cp scripts/deploy-dev-remote.sh scripts/smoke-check.sh release/
          printf '%s\n' '${{ github.sha }}' > release/git-sha
      - name: Upload release
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          source: release
          target: /tmp/efgen-bosh-${{ github.sha }}
      - name: Deploy release on test server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          script: |
            set -euo pipefail
            release_root=/tmp/efgen-bosh-${{ github.sha }}/release
            chmod +x "$release_root"/*.sh
            RELEASE_ID=${{ github.sha }} LOCAL_BASE_URL=http://127.0.0.1:8088 bash "$release_root/deploy-dev-remote.sh" "$release_root"
            rm -rf /tmp/efgen-bosh-${{ github.sha }}
      - name: Public smoke check
        run: bash scripts/smoke-check.sh --base-url "${{ vars.PUBLIC_BASE_URL }}" --retries 15
